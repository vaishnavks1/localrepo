  - meta charset="UTF-8" declared early prevents character encoding auto-detection overhead and potential re-parsing.
  - link rel="icon" href="data:," avoids unnecessary 404 network requests for favicon.ico.
-->

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="data:,">
</head>

</body>
</html>
